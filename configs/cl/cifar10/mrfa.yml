scenario:
  n_experiences: 5
  seed: 1
  shuffle: False
  dataset_dir: tmp/
  return_task_id: False
  make_plots: False
  resume_eval: False
  fixed_class_order: fixed
  class_order_pickle: none
  ckpt_dir: tmp/checkpoints
  init_weights_path: tmp/initial_weights.pth
  init_mode: checkpoint
strategy:
  name: mrfa
  train_mb_size: 128           # BiC often benefits from slightly larger batches for stability
  train_epochs: 100            # Stage 1 epochs (feature learning)
  eval_mb_size: 100
  mem_size: 500               
  beta: 1e-3
  update_freq: 1
  milestones: []
  lr_gamma: 0.1
  clip_grad: True
  max_norm: 1.0
model:
  name: resnet32
optimizer:
  name: SGD
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0002         # Slightly lower decay is common for BiC (vs 0.0005 for DER)
  nesterov: False
use_amp: False
calibrate_ood_scores:
  enabled: False
  method: mean_shift       # mean_shift | z_norm | robust_anchor | zero_mean | none
  buffer_size: 20
  margin_lambda: 0.5
  anchor: recent           # reference: recent | oldest | max_spread | mean_all
  buffer_selection: random # exemplar selection: random | herding
  task_split_factor: 1     # >1 evaluates finer task partitions at inference
