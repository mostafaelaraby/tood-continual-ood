scenario:
  n_experiences: 100
  seed: 1
  shuffle: False
  dataset_dir: tmp/
  return_task_id: False
  make_plots: False
  resume_eval: False
  fixed_class_order: fixed
  class_order_pickle: none
  ckpt_dir: tmp/checkpoints
  init_weights_path: tmp/initial_weights.pth
  init_mode: checkpoint
strategy:
  name: FOSTER
  train_mb_size: 64
  train_epochs: 30
  eval_mb_size: 128
  mem_size: 20000
  milestones: [13, 21, 27]
  lr_gamma: 0.1
  clip_grad: True
  max_norm: 1.0
  # FOSTER-specific hyperparameters (ECCV 2022, scaled to ImageNet regime)
  beta1: 0.5             # effective-number weight for boosting CE
  beta2: 0.5             # effective-number weight for compression BKD
  lambda_okd: 1.0        # KD loss weight during feature boosting
  T: 2.0                 # KD temperature
  compression_lr: 0.1
  weight_decay: 0.0001
  compress_batch_size: 64
  use_weight_align: False
model:
  name: resnet50
optimizer:
  name: SGD
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0001
  nesterov: False
use_amp: False
calibrate_ood_scores:
  enabled: False
  method: mean_shift       # mean_shift | z_norm | robust_anchor | zero_mean | none
  buffer_size: 20
  margin_lambda: 0.5
  anchor: recent           # reference: recent | oldest | max_spread | mean_all
  buffer_selection: random # exemplar selection: random | herding
  task_split_factor: 1     # >1 evaluates finer task partitions at inference
