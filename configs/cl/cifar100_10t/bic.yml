scenario:
  n_experiences: 10
  seed: 1
  shuffle: False
  dataset_dir: tmp/
  return_task_id: False
  make_plots: False
  resume_eval: False
  fixed_class_order: fixed
  class_order_pickle: none
  ckpt_dir: tmp/checkpoints
  init_weights_path: tmp/initial_weights.pth
  init_mode: checkpoint
strategy:
  name: BiC
  train_mb_size: 128
  train_epochs: 170          # Long training schedule used for BiC.
  eval_mb_size: 128
  mem_size: 2000
  val_percentage: 0.1
  T: 2
  stage_2_epochs: 20
  lamb: -1
  clip_grad: True
  max_norm: 1.0
  milestones: [60, 100, 140]
  lr_gamma: 0.1  
model:
  name: resnet32
optimizer:
  name: SGD
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0002
  nesterov: False
use_amp: False
calibrate_ood_scores:
  enabled: False
  method: mean_shift       # mean_shift | z_norm | robust_anchor | zero_mean | none
  buffer_size: 20
  margin_lambda: 0.5
  anchor: recent           # reference: recent | oldest | max_spread | mean_all
  buffer_selection: random # exemplar selection: random | herding
  task_split_factor: 1     # >1 evaluates finer task partitions at inference
